# tradebot-backtest configuration. Copy to backtest.conf and edit.

[backtest]
symbol = ETHUSDT
from = 2024-01-01
to = 2024-02-01
initial_cash = 10000
seed = 1
sample_interval = 1m        # equity curve resolution
load_tickers = false
# stored_candles = 1m       # feed stored candles to strategies as well

[data]
dir = data
venue = binance

[instrument]
base = ETH
quote = USDT
tick_size = 0.01
lot_size = 0.0001
min_quantity = 0.0001
min_notional = 5

[exchange]
maker_fee_bps = 10          # 0.10%
taker_fee_bps = 10
queue_model = queue         # optimistic | queue | pessimistic
consume_liquidity = true
fallback_to_trades = true   # trades-only data: fill at last trade +/- slippage
trade_slippage_bps = 5
latency = jitter            # zero | constant | jitter
latency_market_data = 5ms
latency_order = 5ms
latency_ack = 5ms
latency_jitter = 10ms

[risk]
max_position = 5
max_order_notional = 20000
max_price_deviation = 0.05
max_open_orders = 10
max_orders_per_minute = 60
max_drawdown = 2000
max_daily_loss = 1000
allow_short = false

[strategy]
name = ma_crossover         # buy_and_hold | ma_crossover | mean_reversion | breakout | random
label = ma_1h

[strategy.params]
interval = 1h
fast = 10
slow = 30
equity_fraction = 0.95

# Uncomment to run a parameter sweep (cartesian product):
# [sweep]
# fast = 5, 10, 20
# slow = 30, 60, 120
