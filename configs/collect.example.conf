# tradebot-collect configuration. Copy to collect.conf and edit.
# Any key can be overridden with an environment variable, e.g.
#   TRADEBOT_COLLECTOR_SYMBOL=BTCUSDT

[data]
dir = data                      # raw archives go under <dir>/raw/binance/<symbol>/

[collector]
symbol = ETHUSDT
ws_base = wss://stream.binance.com:9443
rest_base = https://api.binance.com
streams = aggTrade, trade, depth@100ms, kline_1m, bookTicker
depth_snapshot_limit = 1000
stale_timeout = 15s             # reconnect if nothing arrives for this long
flush_interval = 1s             # bound on data lost in a crash
snapshot_interval = 1h          # periodic full-book snapshots for seekable replay
max_connection_age = 23h        # Binance closes connections at 24h

[tls]
# ca_file = /etc/ssl/certs/ca-certificates.crt   # extra CA bundle if needed
