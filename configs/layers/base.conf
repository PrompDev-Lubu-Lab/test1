# Layer 1 of 3: what never changes between environments (instrument, feed,
# exchange model). Combine: --config base.conf --config strategy-*.conf --config env-*.conf

[paper]
symbol = ETHUSDT
flush_interval = 1m
archive_raw = true
resume = true
feed_stale_after = 15s
auto_rearm = true
heartbeat_interval = 5s

[backtest]
sample_interval = 1m
seed = 1

[data]
dir = data

[collector]
ws_base = wss://stream.binance.com:9443
rest_base = https://api.binance.com
streams = aggTrade, trade, depth@100ms, kline_1m, bookTicker
stale_timeout = 15s
snapshot_interval = 1h

[instrument]
tick_size = 0.01
lot_size = 0.0001
min_quantity = 0.0001
min_notional = 5

[exchange]
maker_fee_bps = 10
taker_fee_bps = 10
queue_model = queue
latency = jitter
latency_order = 20ms
latency_ack = 20ms
latency_jitter = 30ms

[live]
recv_window = 5s
query_after = 5s
reconcile_interval = 1m
reconcile_base_tolerance = 0.0001
reconcile_quote_tolerance = 1
reconcile_mismatches_to_trip = 2
cancel_unknown_orders = true
cancel_on_stop = true
max_clock_skew = 1s
