# Layer 3 of 3: live. Tiny capital; every limit below is enforced at start.
# Uncomment `confirm` only after docs/PRE_LIVE_CHECKLIST.md is complete.
[live]
mode = live
max_capital = 200
# confirm = I understand this sends real orders with real money

[paper]
initial_cash = 200            # must equal the account's quote balance

[risk]
max_position = 0.05
max_order_notional = 50
max_price_deviation = 0.02
max_open_orders = 2
max_orders_per_minute = 6
max_drawdown = 20
max_daily_loss = 10
flatten_on_trip = true
