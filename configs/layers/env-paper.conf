# Layer 3 of 3: paper environment. Generous limits; nothing is at stake.
[live]
mode = paper

[paper]
initial_cash = 10000

[risk]
max_position = 2
max_order_notional = 10000
max_price_deviation = 0.05
max_open_orders = 10
max_orders_per_minute = 30
max_drawdown = 500
max_daily_loss = 300
flatten_on_trip = true
