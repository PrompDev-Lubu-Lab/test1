# Layer 3 of 3: shadow environment. Same limits as live so the "would send"
# log shows exactly what live would do. Needs API keys (read-only use).
[live]
mode = shadow

[paper]
initial_cash = 200

[risk]
max_position = 0.05
max_order_notional = 50
max_price_deviation = 0.02
max_open_orders = 2
max_orders_per_minute = 6
max_drawdown = 20
max_daily_loss = 10
flatten_on_trip = true
