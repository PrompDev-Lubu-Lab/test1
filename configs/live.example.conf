# tradebot-live configuration. Copy to live.conf and edit.
#
# One file drives all four modes; only [live] mode changes what sits behind
# the ExecutionVenue interface. The [instrument], [exchange], [risk] and
# [strategy] sections are the same as in backtest and paper configs, so a
# strategy validated in research runs here unchanged.
#
# Credentials are never read from this file: export
#   TRADEBOT_BINANCE_API_KEY / TRADEBOT_BINANCE_API_SECRET
# (testnet keys for mode = testnet; a key with trading permission only,
# no withdrawals, for mode = live).

[live]
mode = shadow                   # paper | shadow | testnet | live
# rest_base = https://api.binance.com            # testnet default: https://testnet.binance.vision
# user_stream_base = wss://stream.binance.com:9443  # testnet default: wss://stream.testnet.binance.vision
# proxy = http://proxy:3128     # or "none"; default: HTTPS_PROXY from the environment
recv_window = 5s                # signed-request validity window
query_after = 5s                # query an order with no ack or stream event after this
reconcile_interval = 1m         # compare venue balances with the portfolio
reconcile_base_tolerance = 0.0001
reconcile_quote_tolerance = 1
reconcile_mismatches_to_trip = 2   # consecutive mismatches that trip the kill switch (1 may be a fill in flight)
cancel_unknown_orders = true    # at start, cancel our open orders left by a previous run
cancel_on_stop = true           # cancel working orders on shutdown
max_clock_skew = 1s             # refuse to start if our clock and the venue's differ by more

# mode = live additionally requires these (see docs/PRE_LIVE_CHECKLIST.md):
# confirm = I understand this sends real orders with real money
# max_capital = 200             # initial_cash, max_order_notional and max_daily_loss must not exceed it

[paper]
label = ma_1h                   # artifacts in runs/<mode>-<label>/
symbol = ETHUSDT
initial_cash = 200              # live: must equal the quote balance on the account
flush_interval = 1m
archive_raw = true
resume = true                   # live: must be true
feed_stale_after = 15s
auto_rearm = true
heartbeat_interval = 5s

[backtest]
sample_interval = 1m
seed = 1

[data]
dir = data

[collector]
ws_base = wss://stream.binance.com:9443
rest_base = https://api.binance.com
streams = aggTrade, trade, depth@100ms, kline_1m, bookTicker
stale_timeout = 15s
snapshot_interval = 1h

[instrument]
tick_size = 0.01
lot_size = 0.0001
min_quantity = 0.0001
min_notional = 5

[exchange]                      # paper/shadow fills only
maker_fee_bps = 10
taker_fee_bps = 10
queue_model = queue
latency = jitter
latency_order = 20ms
latency_ack = 20ms
latency_jitter = 30ms

[risk]
max_position = 0.05
max_order_notional = 50
max_price_deviation = 0.02
max_open_orders = 2
max_orders_per_minute = 6
max_drawdown = 20
max_daily_loss = 10
flatten_on_trip = true

[strategy]
name = ma_crossover
label = ma_1h

[strategy.params]
interval = 1h
fast = 10
slow = 30
equity_fraction = 0.5
