# tradebot-paper configuration. Copy to paper.conf and edit.
# Shares the [instrument], [exchange], [risk], [strategy] sections with
# backtest configs, so a strategy validated in backtests runs unchanged.

[paper]
label = ma_1h                   # artifacts in runs/paper-<label>/
symbol = ETHUSDT
initial_cash = 10000
flush_interval = 1m             # how often artifacts and state.json are written
archive_raw = true              # also archive raw market data under data/raw/
resume = true                   # restore positions from state.json (or the journal) on restart
feed_stale_after = 15s          # kill switch trips if no market data for this long
auto_rearm = true               # reset the kill switch when the feed recovers
heartbeat_interval = 5s         # runs/paper-<label>/heartbeat for external watchdogs

[backtest]
sample_interval = 1m
seed = 1

[data]
dir = data

[collector]
ws_base = wss://stream.binance.com:9443
rest_base = https://api.binance.com
streams = aggTrade, trade, depth@100ms, kline_1m, bookTicker
stale_timeout = 15s
snapshot_interval = 1h

[instrument]
tick_size = 0.01
lot_size = 0.0001
min_quantity = 0.0001
min_notional = 5

[exchange]
maker_fee_bps = 10
taker_fee_bps = 10
queue_model = queue
latency = jitter
latency_order = 20ms
latency_ack = 20ms
latency_jitter = 30ms

[risk]
max_position = 2
max_order_notional = 10000
max_price_deviation = 0.05
max_open_orders = 10
max_orders_per_minute = 30
max_drawdown = 500
max_daily_loss = 300
flatten_on_trip = true          # market-close positions when the kill switch trips

[strategy]
name = ma_crossover
label = ma_1h

[strategy.params]
interval = 1h
fast = 10
slow = 30
equity_fraction = 0.5
