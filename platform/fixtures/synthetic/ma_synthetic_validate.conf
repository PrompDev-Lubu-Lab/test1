# Synthetic fixture configuration. The store under data/ is generated, not
# real market data: a sine-wave mid price with a 12-hour period.
[backtest]
symbol = ETHUSDT
from = 2024-03-15
to = 2024-03-17
initial_cash = 10000
seed = 5
sample_interval = 1m

[data]
dir = data
venue = binance

[instrument]
base = ETH
quote = USDT
tick_size = 0.01
lot_size = 0.0001
min_quantity = 0.0001
min_notional = 5

[exchange]
maker_fee_bps = 10
taker_fee_bps = 10
queue_model = queue
consume_liquidity = true
fallback_to_trades = true
trade_slippage_bps = 5
latency = constant
latency_market_data = 10ms
latency_order = 20ms
latency_ack = 5ms

[risk]
max_position = 10
max_order_notional = 50000
max_price_deviation = 0
max_open_orders = 10
max_orders_per_minute = 60
max_drawdown = 5000
max_daily_loss = 5000
allow_short = false

[strategy]
name = ma_crossover
label = ma_synthetic

[strategy.params]
interval = 15m
fast = 4
slow = 12
quantity = 1

[sweep]
fast = 3, 4, 6
